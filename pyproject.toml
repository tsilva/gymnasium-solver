[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gymsolve-env"
version = "0.1.0"
description = "Environment for gymsolve (uv/jupyter kernel)"
requires-python = ">=3.12"
dependencies = [
    "gymnasium[classic-control,atari,box2d,mujoco,other]",
    "gymnasium-robotics",
    "ale-py",
    "minari[hdf5]",
    "torch",
    "numpy",
    "wandb",
    "wandb-workspaces",
    # Pin OCAtari to avoid broken sdists (e.g., 1.1.5 missing requirements.txt)
    "ocatari>=2.2.1",
    "pytorch-lightning",
    "ipykernel",
    "jupyter",
    "torchvision",
    "pytest",
    "pyyaml",
    "ruamel.yaml",
    "watchdog",
    "setuptools<83",
    "huggingface_hub>=0.22.0",
    "gradio>=4.0.0",
    "matplotlib",
    "vizdoom",
    "mcp",
    "python-dotenv",
    "modal>=0.64.0",
    "stable-retro-apple-silicon==0.9.9.post1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "stable-retro>=0.9.9; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "pyqtgraph>=0.13.7",
    "grad-cam>=1.5.4",
    "opencv-python-headless>=4.8.0",  # Override grad-cam's opencv-python to avoid Qt conflicts
    "google-generativeai>=0.8.6",
    "openai>=2.21.0",
    "pillow>=11.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agents*",
    "config*",
    "gym_envs*",
    "gym_wrappers*",
    "loggers*",
    "schemas*",
    "trainer_callbacks*",
    "utils*",
    "vizdoom_configs*",
]
exclude = ["tests*", "VIBES*", "scripts*"]

[tool.pytest.ini_options]
# Test discovery patterns
testpaths = ["tests", "learners", "utils"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Add the current directory to the Python path so imports work correctly
addopts = [
    "-v",                    # Verbose output
    "--tb=short",           # Short traceback format
    "--strict-markers",     # Strict marker handling
    "-ra",                  # Show short test summary for all outcomes
]

# Add current directory to Python path for imports
pythonpath = ["."]

# Configure test markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Minimum version requirement
minversion = "6.0"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
